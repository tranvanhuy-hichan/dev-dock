[package]
name = "devdock"
version = "0.1.0"
description = "DevDock — developer toolbox, system monitor, snippet vault, Docker desk"
edition = "2021"

[lib]
name = "devdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["codegen"] }

[dependencies]
base64 = "0.23.1"
devdock-core = { version = "0.1.0", path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
