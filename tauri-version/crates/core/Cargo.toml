[package]
name = "devdock-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
futures-util = "0.3.34"
listeners = "0.6.1"
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
